<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ARWallet UI 设计资产库</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 14px/1.45 "Segoe UI", sans-serif; background: #f4f5f7; color: #1f262f; }
  header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid #e4e6eb; padding: 16px 20px 12px; }
  h1 { margin: 0 0 10px; font-size: 18px; }
  [hidden] { display: none !important; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; }
  input, select, button { font: inherit; border: 1px solid #d5d8de; border-radius: 6px; padding: 6px 8px; background: #fff; }
  input { min-width: 220px; }
  main { padding: 16px 20px 40px; }
  .meta { margin: 8px 0 0; color: #5d6575; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  article { background: #fff; border: 1px solid #e4e6eb; border-radius: 10px; overflow: hidden; }
  .stage { height: 140px; display: grid; place-items: center; }
  .stage.white { background: #fff; }
  .stage.gray { background: #d5d8de; }
  .stage.dark { background: #1f262f; }
  .stage img, .stage object { width: 96px; height: 72px; object-fit: contain; }
  .body { padding: 10px 12px 12px; }
  .name { font-weight: 650; word-break: break-all; }
  dl { margin: 8px 0 0; display: grid; grid-template-columns: 72px 1fr; gap: 2px 8px; }
  dt { color: #7e858e; }
  dd { margin: 0; word-break: break-word; }
  #cmp-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .pathline { margin: 8px 0 0; }
  a { color: #8a6500; }
  .empty { padding: 40px 0; color: #7e858e; }

  .doc { background: #fff; border: 1px solid #e4e6eb; border-radius: 10px; padding: 16px 18px 8px; margin: 0 0 16px; }
  .doc h2 { margin: 0 0 4px; font-size: 18px; }
  .doc h3 { margin: 18px 0 8px; font-size: 15px; }
  .doc .stamp { margin: 0 0 8px; color: #8a6500; }
  .doc .note { margin: 0 0 8px; color: #5d6575; }
  .doc table { width: 100%; border-collapse: collapse; margin: 0 0 8px; }
  .doc th, .doc td { border-bottom: 1px solid #eef0f3; padding: 6px 8px; text-align: left; vertical-align: top; }
  .doc th { color: #7e858e; font-weight: 600; white-space: nowrap; }
  .swatch { display: inline-flex; align-items: center; gap: 6px; }
  .swatch i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #e4e6eb; display: inline-block; }
  .nav { display: flex; gap: 8px; margin: 0 0 12px; }
  .nav button[aria-pressed="true"] { background: #1f262f; color: #fff; border-color: #1f262f; }
  .lead { margin: 0 0 12px; color: #5d6575; }
  .slot { border-style: dashed; }
  .tag { display: inline-block; margin-bottom: 6px; padding: 1px 6px; border-radius: 999px; background: #f4f5f7; color: #5d6575; font-size: 12px; }
  .tag.wait { background: #fff6da; color: #8a6500; }
  .tag.native { background: #e8f6ee; color: #1d6b3a; }
  a.path { color: #8a6500; }

</style>
</head>
<body>
<header>
  <h1>ARWallet UI 设计资产库</h1>
  <div class="nav">
    <button type="button" data-view="assets" aria-pressed="true">素材</button>
    <button type="button" data-view="components" aria-pressed="false">组件</button>
    <button type="button" data-view="tokens" aria-pressed="false">设计规范</button>
  </div>
  <div class="bar" id="asset-bar">
    <input id="q" type="search" placeholder="按名称、节点名、页面搜索"/>
    <select id="cat"><option value="">全部分类</option></select>
    <select id="fmt"><option value="">全部格式</option></select>
    
    <select id="page"><option value="">全部页面</option></select>
    <select id="batch"><option value="">全部批次</option></select>
    <select id="valid"><option value="">全部来源结论</option></select>
    <select id="vis"><option value="">全部显隐状态</option></select>
    <select id="st"><option value="">全部状态</option></select>
    <button type="button" data-bg="white">白底</button>
    <button type="button" data-bg="gray">灰底</button>
    <button type="button" data-bg="dark">深底</button>
  </div>
  <div class="bar" id="cmp-bar" hidden>
    <input id="cq" type="search" placeholder="按名称、节点、页面搜索组件"/>
    <select id="ckind">
      <option value="">全部记录</option>
      <option value="尚未采集">尚未采集的控件</option>
      <option value="原生组件">原生组件</option>
      <option value="候选项">候选项</option>
    </select>
  </div>
  <p class="meta" id="count"></p>
</header>
<main>
  <section id="view-assets">
    <div class="grid" id="grid"></div>
  </section>
  <section id="view-components" hidden>
    <p class="lead">出稿前先在这里找同名控件。有记录就沿对照路径回 Figma 节点和引用素材。没有记录就不要另造一套样式。候选项没有 Key，标准化未完成，实例复用未验证。</p>
    <div class="grid" id="cmp-grid"></div>
  </section>
  <section id="view-tokens" hidden>
    <p class="lead">下面 8 份文档直接读取 04-Design-Tokens 里的文件。确认状态仍是未确认，这里只是把条目摊开阅读，不另写一套数值。</p>
    <div id="token-list"></div>
  </section>
</main>

<script>
const index = JSON.parse(document.getElementById("data").textContent);
const assets = index.assets;
const byId = Object.fromEntries(assets.map(a => [a.asset_id, a]));
const grid = document.getElementById("grid");
const q = document.getElementById("q");
const cat = document.getElementById("cat");
const fmt = document.getElementById("fmt");
const st = document.getElementById("st");
const page = document.getElementById("page");
const batch = document.getElementById("batch");
const vis = document.getElementById("vis");
let bg = "gray";
function fill(sel, values) {
  [...new Set(values)].filter(v => v !== undefined && v !== null && v !== "").sort().forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v; sel.appendChild(o);
  });
}
fill(cat, assets.map(a => a.category));
fill(fmt, assets.map(a => a.format));
fill(st, assets.map(a => a.status));
fill(page, assets.map(a => a.source_page));
fill(batch, assets.map(a => a.batch || "batch-01"));
const valid = document.getElementById("valid");
fill(vis, assets.map(a => a.state));
fill(valid, assets.map(a => a.source_validity || ""));
function related(a) {
  if (!a.related_assets || !a.related_assets.length) return "无";
  return a.related_assets.map(id => {
    const hit = byId[id];
    return hit ? hit.asset_name + "（" + hit.state + "）" : id;
  }).join("、");
}
function render() {
  const text = q.value.trim().toLowerCase();
  const rows = assets.filter(a => {
    if (cat.value && a.category !== cat.value) return false;
    if (fmt.value && a.format !== fmt.value) return false;
    if (st.value && a.status !== st.value) return false;
    if (page.value && a.source_page !== page.value) return false;
    if (batch.value && (a.batch || "batch-01") !== batch.value) return false;
    if (vis.value && a.state !== vis.value) return false;
    if (valid && valid.value && (a.source_validity || "") !== valid.value) return false;
    if (!text) return true;
    const blob = [a.asset_name, a.figma_node_name, a.figma_node_id, a.source_page, a.description, a.state, a.batch, a.source_validity].join(" ").toLowerCase();
    return blob.includes(text);
  });
  document.getElementById("count").textContent = "显示 " + rows.length + " / " + assets.length + "。点卡片可看第一项关联素材。";
  grid.innerHTML = "";
  if (!rows.length) {
    grid.innerHTML = '<p class="empty">没有匹配的素材。</p>';
    return;
  }
  for (const a of rows) {
    const card = document.createElement("article");
    const stage = document.createElement("div");
    stage.className = "stage " + bg;
    const img = document.createElement("img");
    img.alt = a.asset_name;
    img.src = a.file_path;
    stage.appendChild(img);
    const body = document.createElement("div");
    body.className = "body";
    const sources = (a.duplicate_sources || []).join(", ") || "无";
    body.innerHTML =
      '<div class="name"></div><dl>' +
      "<dt>类型</dt><dd></dd><dt>尺寸</dt><dd></dd><dt>格式</dt><dd></dd>" +
      "<dt>状态</dt><dd></dd><dt>批次</dt><dd></dd><dt>来源结论</dt><dd></dd><dt>来源页面</dt><dd></dd>" +
      "<dt>节点</dt><dd></dd><dt>确认</dt><dd></dd><dt>关联</dt><dd></dd><dt>其他来源</dt><dd></dd>" +
      "</dl>";
    const bits = body.querySelectorAll("dd");
    body.querySelector(".name").textContent = a.asset_name;
    const vals = [
      a.category, a.width + " × " + a.height, a.format, a.state, a.batch || "batch-01", a.source_validity || "",
      a.source_page, a.figma_node_id + "  " + a.figma_node_name,
      a.status, related(a), sources
    ];
    vals.forEach((v, i) => { bits[i].textContent = v; });
    card.appendChild(stage);
    card.appendChild(body);
    card.addEventListener("click", () => {
      const others = (a.related_assets || []).map(id => byId[id]).filter(Boolean);
      if (!others.length) return;
      q.value = others[0].asset_name;
      render();
    });
    grid.appendChild(card);
  }
}
const FILE_KEY = "YYptLQ7axFJt2SrhF2u6JU";
const controlSlots = [
  { kind: "按钮", name: "Button", structure: "背景、圆角、居中文字", assets: "通常无。若有图标，只写素材 ID" },
  { kind: "输入框", name: "Input", structure: "背景、圆角、内边距、边框、文字", assets: "无" },
  { kind: "下拉选择器", name: "Select", structure: "文字标签、选择框、框内文字、箭头", assets: "箭头图标的素材 ID" },
  { kind: "复选框", name: "Checkbox", structure: "方块、对勾、右侧文字", assets: "对勾图标的素材 ID" }
];
let library = null;
let viewName = "assets";

function figmaLink(nodeId) {
  if (!nodeId) return "";
  return "https://www.figma.com/design/" + FILE_KEY + "/AR-Wallet?node-id=" + String(nodeId).replace(":", "-");
}
function records() {
  if (!library) return [];
  const native = (library.nativeComponents || []).map(c => ({
    role: "原生组件",
    name: c.name,
    type: c.type || "COMPONENT",
    id: c.id,
    key: c.key || "",
    page: c.page || "",
    style: "未记录",
    structure: "未记录",
    states: "未读到",
    assets: "未记录",
    note: "有 Component Key。标准化未完成。实例复用没有全文件验证。"
  }));
  const items = library.candidates && library.candidates.items ? library.candidates.items : [];
  const candidates = items.filter(c => c.control !== false).map(c => ({
    role: "候选项",
    control_kind: c.control_kind || "",
    name: c.control_kind ? (c.control_kind + " · " + c.name) : c.name,
    type: c.type || "FRAME",
    id: c.figma_node_id,
    key: c.key || "",
    page: c.page_id || "",
    style: c.style || (c.width ? (c.width + " × " + c.height) : "未记录"),
    structure: c.structure || "未记录",
    states: c.states || "未读到",
    assets: (c.asset_ids && c.asset_ids.length) ? c.asset_ids.join("、") : "未记录",
    instances: c.instances || [],
    note: c.note || "Frame 或 Group。Key 为空。"
  }));
  return native.concat(candidates);
}
function cardField(dl, label, value) {
  const dt = document.createElement("dt");
  dt.textContent = label;
  const dd = document.createElement("dd");
  dd.textContent = value;
  dl.append(dt, dd);
}
function renderComponents() {
  const host = document.getElementById("cmp-grid");
  const kind = document.getElementById("ckind").value;
  const text = document.getElementById("cq").value.trim().toLowerCase();
  host.innerHTML = "";
  const covered = new Set(records().map(r => r.control_kind).filter(Boolean));
  const slots = controlSlots.filter(s => !covered.has(s.kind)).filter(s => !kind || kind === "尚未采集").filter(s => {
    if (!text) return true;
    return (s.kind + " " + s.name).toLowerCase().includes(text);
  });
  slots.forEach(s => {
    const card = document.createElement("article");
    card.className = "slot";
    const body = document.createElement("div");
    body.className = "body";
    body.innerHTML = '<span class="tag wait">尚未采集</span><div class="name"></div>';
    body.querySelector(".name").textContent = s.kind + " · " + s.name;
    const dl = document.createElement("dl");
    cardField(dl, "对照路径", "还没有节点");
    cardField(dl, "结构", s.structure);
    cardField(dl, "样式", "未记录。按节点读取，不预填色值和圆角");
    cardField(dl, "状态", "未读到");
    cardField(dl, "引用素材", s.assets);
    cardField(dl, "Key", "空");
    body.appendChild(dl);
    card.appendChild(body);
    host.appendChild(card);
  });
  const rows = records().filter(r => !kind || kind === r.role).filter(r => {
    if (!text) return true;
    return [r.name, r.id, r.page, r.note, r.role, r.structure, r.assets].join(" ").toLowerCase().includes(text);
  });
  rows.forEach(r => {
    const card = document.createElement("article");
    const body = document.createElement("div");
    body.className = "body";
    body.innerHTML = '<span class="tag"></span><div class="name"></div>';
    const tag = body.querySelector(".tag");
    tag.textContent = r.role;
    if (r.role === "原生组件") tag.classList.add("native");
    body.querySelector(".name").textContent = r.name;
    const dl = document.createElement("dl");
    const link = document.createElement("a");
    link.className = "path";
    link.href = figmaLink(r.id);
    link.target = "_blank";
    link.rel = "noreferrer";
    link.textContent = r.page + " / " + r.id;
    const path = document.createElement("p");
    path.className = "pathline";
    path.appendChild(document.createTextNode("对照路径 "));
    path.appendChild(link);
    body.appendChild(path);
    cardField(dl, "节点类型", r.type);
    cardField(dl, "Key", r.key || "空");
    cardField(dl, "结构", r.structure);
    cardField(dl, "样式", r.style);
    cardField(dl, "状态", r.states);
    cardField(dl, "引用素材", r.assets);
    const instanceText = (r.instances || []).map(i => {
      return (i.label ? i.label + " " : "") + i.figma_node_id + (i.style_note ? "，" + i.style_note : "");
    }).join("；");
    cardField(dl, "实例", instanceText || "没有另记实例");
    cardField(dl, "标准化", "未完成");
    cardField(dl, "实例复用", "未验证");
    cardField(dl, "说明", r.note);
    body.appendChild(dl);
    card.appendChild(body);
    host.appendChild(card);
  });
  const shown = slots.length + rows.length;
  const total = controlSlots.filter(s => !covered.has(s.kind)).length + records().length;
  if (viewName === "components") {
    document.getElementById("count").textContent = library
      ? ("组件记录 " + shown + " / " + total + "。" + (covered.size ? "已有对照的控件不再留空位。" : "尚未采集的四类控件还没有节点。"))
      : "组件索引还没有载入。";
  }
}
const tokenDocs = [
  { file: "colors.json", title: "颜色" },
  { file: "typography.json", title: "字体" },
  { file: "spacing.json", title: "间距" },
  { file: "sizing.json", title: "尺寸" },
  { file: "radius.json", title: "圆角" },
  { file: "borders.json", title: "描边" },
  { file: "shadows.json", title: "阴影" },
  { file: "icon-rules.json", title: "图标" }
];
const tokenKeyLabel = {
  name: "名称", status: "状态", confirmation: "确认", hex: "色值", rgba: "RGBA", role: "用途",
  reason: "依据", scene: "场景", evidence: "样本", note: "说明", page: "页面", sampleCount: "样本数",
  px: "数值", family: "字体", weight: "字重", size: "字号", lineHeight: "行高", align: "对齐",
  color: "颜色", nodeId: "节点", nodeIds: "节点", pages: "页面", roles: "字重", rank: "排序",
  value: "取值", type: "类型", offsetX: "水平偏移", offsetY: "垂直偏移", blur: "模糊", spread: "扩展",
  alpha: "不透明度", candidates: "候选", suggestion: "建议", group: "组", values: "色值", rule: "规则",
  statement: "说明", category: "分类", id: "编号", scopes: "范围", height: "高度", width: "宽度",
  padding: "内边距", sample: "样本",
  boundVariablesInFirst2000BuyNodes: "买入前 2000 个节点里绑定变量的数量",
  effectStyles: "效果样式数量"
};
const tokenSectionTitle = {
  existing: "稿面已有", existingVariables: "文件里已有的颜色变量", existingObservations: "采样到的颜色",
  existingFamilies: "用过的字体", existingSizes: "用过的字号", existingGapFrequency: "间距出现次数",
  existingPaddingFrequency: "内边距", existingComponents: "已有的导航图标", recommended: "推荐，尚未确认",
  pending: "还不能定", observations: "读取结论", nearDuplicates: "相近但还没合并的颜色", divider: "分割线"
};
const tokenStatusText = { Existing: "稿面已有", Recommended: "推荐", Pending: "待定" };
const tokenSkip = new Set(["pageId", "sourceFileKey", "project", "sourceFileName"]);
let tokenCache = null;

function tokenCell(key, value) {
  if (value == null || value === "") return document.createTextNode("—");
  if (key === "status" && tokenStatusText[value]) return document.createTextNode(tokenStatusText[value]);
  if (key === "confirmation") return document.createTextNode(value === "unconfirmed" ? "未确认" : String(value));
  if ((key === "hex" || key === "color") && typeof value === "string" && value.charAt(0) === "#") {
    const span = document.createElement("span");
    span.className = "swatch";
    const chip = document.createElement("i");
    chip.style.background = value;
    span.appendChild(chip);
    span.appendChild(document.createTextNode(value));
    return span;
  }
  if (Array.isArray(value)) return document.createTextNode(value.map(v => typeof v === "object" ? JSON.stringify(v) : String(v)).join("、"));
  if (typeof value === "object") {
    return document.createTextNode(Object.entries(value).map(pair => (tokenKeyLabel[pair[0]] || pair[0]) + " " + pair[1]).join("，"));
  }
  return document.createTextNode(String(value));
}
function tokenTable(rows) {
  const keys = [];
  rows.forEach(row => {
    Object.keys(row).forEach(key => {
      if (!tokenSkip.has(key) && keys.indexOf(key) < 0) keys.push(key);
    });
  });
  const table = document.createElement("table");
  const head = document.createElement("tr");
  keys.forEach(key => {
    const th = document.createElement("th");
    th.textContent = tokenKeyLabel[key] || key;
    head.appendChild(th);
  });
  table.appendChild(head);
  rows.forEach(row => {
    const tr = document.createElement("tr");
    keys.forEach(key => {
      const td = document.createElement("td");
      td.appendChild(tokenCell(key, row[key]));
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  return table;
}
function paintTokens(host, docs) {
  host.innerHTML = "";
  docs.forEach(doc => {
    const article = document.createElement("article");
    article.className = "doc";
    const h2 = document.createElement("h2");
    h2.textContent = doc.title;
    article.appendChild(h2);
    const stamp = document.createElement("p");
    stamp.className = "stamp";
    const meta = doc.data.meta || {};
    stamp.textContent = "确认状态：未确认" + (meta.extractedAt ? " · 读取于 " + meta.extractedAt : "") + " · " + doc.file;
    article.appendChild(stamp);
    Object.keys(meta).forEach(key => {
      if (tokenSkip.has(key) || key === "extractedAt" || key === "confirmation") return;
      const value = meta[key];
      if (value == null || typeof value === "object") return;
      const p = document.createElement("p");
      p.className = "note";
      p.textContent = typeof value === "number" ? ((tokenKeyLabel[key] || key) + "：" + value) : String(value);
      article.appendChild(p);
    });
    Object.keys(doc.data).forEach(key => {
      if (key === "meta") return;
      const value = doc.data[key];
      const h3 = document.createElement("h3");
      h3.textContent = tokenSectionTitle[key] || key;
      article.appendChild(h3);
      if (Array.isArray(value) && value.length && typeof value[0] === "object") article.appendChild(tokenTable(value));
      else if (value && typeof value === "object" && !Array.isArray(value)) {
        const p = document.createElement("p");
        p.className = "note";
        p.textContent = Object.entries(value).filter(pair => !tokenSkip.has(pair[0])).map(pair => (tokenKeyLabel[pair[0]] || pair[0]) + "：" + pair[1]).join("。");
        article.appendChild(p);
      }
    });
    host.appendChild(article);
  });
}
function renderTokens() {
  const host = document.getElementById("token-list");
  if (tokenCache) {
    paintTokens(host, tokenCache);
    return;
  }
  host.textContent = "正在读取规范文件…";
  Promise.all(tokenDocs.map(doc => fetch("04-Design-Tokens/" + doc.file).then(res => {
    if (!res.ok) throw new Error(doc.file);
    return res.json().then(data => ({ file: doc.file, title: doc.title, data: data }));
  }))).then(docs => {
    tokenCache = docs;
    paintTokens(host, docs);
    if (viewName === "tokens") document.getElementById("count").textContent = "8 份规范文档。确认状态仍是未确认。";
  }).catch(() => {
    host.textContent = "没有读到 04-Design-Tokens 里的规范文件。";
  });
}
function showView(name) {
  viewName = name;
  document.querySelectorAll("[data-view]").forEach(btn => {
    btn.setAttribute("aria-pressed", btn.dataset.view === name ? "true" : "false");
  });
  document.getElementById("view-assets").hidden = name !== "assets";
  document.getElementById("view-components").hidden = name !== "components";
  document.getElementById("view-tokens").hidden = name !== "tokens";
  document.getElementById("asset-bar").hidden = name !== "assets";
  document.getElementById("cmp-bar").hidden = name !== "components";
  if (name === "assets") render();
  if (name === "components") renderComponents();
  if (name === "tokens") {
    renderTokens();
    document.getElementById("count").textContent = tokenCache ? "8 份规范文档。确认状态仍是未确认。" : "正在读取规范文件…";
  }
}
q.addEventListener("input", render);
[cat, fmt, st, page, batch, vis, valid].forEach(el => el.addEventListener("change", render));
document.querySelectorAll("[data-bg]").forEach(btn => {
  btn.addEventListener("click", () => { bg = btn.dataset.bg; render(); });
});
document.querySelectorAll("[data-view]").forEach(btn => {
  btn.addEventListener("click", () => showView(btn.dataset.view));
});
document.getElementById("cq").addEventListener("input", renderComponents);
document.getElementById("ckind").addEventListener("change", renderComponents);
render();
fetch("03-Components/component-index.json")
  .then(res => res.json())
  .then(data => { library = data; renderComponents(); })
  .catch(() => {
    document.getElementById("cmp-grid").innerHTML = '<p class="empty">没有读到 03-Components/component-index.json。</p>';
  });
</script>
